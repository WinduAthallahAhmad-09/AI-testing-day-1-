<!DOCTYPE html>
<html lang="id">
<head>
    <script src="/js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Detail Kendaraan - Motorku Tercinta</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .btn-primary { background: linear-gradient(to right, #2563eb, #4f46e5); color: white; border-radius: 0.75rem; font-weight: 500; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); border: none; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        .btn-secondary { background-color: #ffffff; color: #374151; border-radius: 0.75rem; font-weight: 500; border: 1px solid #e5e7eb; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); cursor: pointer; }
        .btn-secondary:hover { background-color: #f9fafb; border-color: #d1d5db; }
        .form-input { border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 0.625rem 0.875rem; font-size: 0.875rem; outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 text-gray-800 font-inter antialiased min-h-screen pb-20">

    <!-- Navigation Bar -->
    <nav class="bg-white/80 backdrop-blur-lg shadow-sm border-b border-gray-100 sticky top-0 z-40 transition-smooth">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer transition-smooth hover:opacity-80" onclick="window.location.href='/'">
                        <i data-lucide="wrench" class="h-6 w-6 text-blue-600"></i>
                        <span class="font-bold text-xl text-gray-900 tracking-tight">Motorku Tercinta</span>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="user-greeting" class="text-sm font-medium text-gray-700 mr-4"></span>
                    <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800 font-medium flex items-center transition-smooth"><i data-lucide="log-out" class="h-4 w-4 mr-1"></i>Keluar</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in-up">
        
        <!-- Vehicle Header Card -->
        <div class="mb-6">
            <button onclick="window.location.href='/vehicles.html'" class="flex items-center text-sm text-gray-500 hover:text-gray-900 mb-4 transition-smooth">
                <i data-lucide="arrow-left" class="h-4 w-4 mr-1"></i>
                Kembali ke Daftar Kendaraan
            </button>

            <div class="bg-white rounded-2xl shadow-lg shadow-gray-200/50 border border-gray-50 p-5 sm:p-6 hover:shadow-xl transition-all duration-300" id="vehicle-header-container">
                <!-- Injected via JS -->
                <div class="flex justify-center items-center h-32">
                    <i data-lucide="loader-2" class="h-8 w-8 text-blue-500 animate-spin"></i>
                </div>
            </div>
        </div>

        <!-- Tabs Navigation -->
        <div class="border-b border-gray-200 mb-6">
            <nav class="-mb-px flex space-x-6" aria-label="Tabs">
                <button onclick="switchTab('status')" data-tab="status" class="tab-btn active border-blue-500 text-blue-600 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm flex items-center transition-smooth">
                    <i data-lucide="activity" class="h-4 w-4 mr-2"></i>
                    Status Perawatan
                </button>
                <button onclick="switchTab('history')" data-tab="history" class="tab-btn border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm flex items-center transition-smooth">
                    <i data-lucide="history" class="h-4 w-4 mr-2"></i>
                    Riwayat
                </button>
                <button onclick="switchTab('settings')" data-tab="settings" class="tab-btn border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm flex items-center transition-smooth">
                    <i data-lucide="settings" class="h-4 w-4 mr-2"></i>
                    Pengaturan
                </button>
            </nav>
        </div>

        <!-- Tab Content: Status Perawatan -->
        <div id="tab-status" class="tab-content active block space-y-4">
            <div id="status-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Injected via JS -->
                <div class="col-span-full flex justify-center items-center h-32">
                    <i data-lucide="loader-2" class="h-8 w-8 text-blue-500 animate-spin"></i>
                </div>
            </div>
        </div>

        <!-- Tab Content: Riwayat -->
        <div id="tab-history" class="tab-content hidden space-y-4">
            <div class="bg-white rounded-2xl shadow-lg shadow-gray-200/50 border border-gray-50 p-5 hover:shadow-xl transition-all duration-300">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                    <h2 class="font-semibold text-gray-800">Riwayat Perawatan</h2>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <i data-lucide="filter" class="h-4 w-4 text-gray-400"></i>
                        <select id="history-filter" class="text-sm border-gray-300 rounded-xl shadow-sm focus:border-blue-500 focus:ring-blue-500 w-full sm:w-48 form-input">
                            <option value="">Semua Perawatan</option>
                            <!-- Injected via JS -->
                        </select>
                        <button onclick="openAddLog()" class="btn-primary py-2 px-3 whitespace-nowrap flex items-center text-sm">
                            <i data-lucide="plus" class="h-4 w-4 mr-1"></i>
                            Catat Baru
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto rounded-xl border border-gray-100">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tanggal & Odometer</th>
                                <th scope="col" class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Perawatan</th>
                                <th scope="col" class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Detail</th>
                                <th scope="col" class="px-6 py-4 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Biaya</th>
                                <th scope="col" class="px-6 py-4 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="bg-white divide-y divide-gray-50">
                            <!-- Injected via JS -->
                            <tr>
                                <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                                    <i data-lucide="loader-2" class="h-6 w-6 text-blue-500 animate-spin mx-auto mb-2"></i>
                                    Memuat data...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination (simplified) -->
                <div id="history-pagination" class="mt-4 flex justify-between items-center hidden">
                    <span class="text-sm text-gray-500" id="history-count-text">Menampilkan 0 dari 0 data</span>
                    <button class="text-sm font-medium text-blue-600 hover:text-blue-800 transition-smooth" onclick="loadMoreHistory()">Muat lebih banyak</button>
                </div>
            </div>
        </div>

        <!-- Tab Content: Pengaturan -->
        <div id="tab-settings" class="tab-content hidden space-y-4">
            <div class="bg-white rounded-2xl shadow-lg shadow-gray-200/50 border border-gray-50 overflow-hidden hover:shadow-xl transition-all duration-300">
                <div class="p-5 border-b border-gray-50 flex justify-between items-center">
                    <div>
                        <h2 class="font-semibold text-gray-800 text-lg">Pengaturan Perawatan</h2>
                        <p class="text-sm text-gray-500">Atur interval perawatan khusus untuk kendaraan ini.</p>
                    </div>
                    <button onclick="resetSettings()" class="text-sm text-red-600 hover:text-red-700 flex items-center font-medium bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-xl transition-smooth">
                        <i data-lucide="rotate-ccw" class="h-4 w-4 mr-1"></i>
                        Reset Default
                    </button>
                </div>
                
                <form id="settings-form" class="p-0">
                    <div class="divide-y divide-gray-50" id="settings-container">
                        <!-- Injected via JS -->
                        <div class="p-10 flex justify-center">
                            <i data-lucide="loader-2" class="h-8 w-8 text-blue-500 animate-spin"></i>
                        </div>
                    </div>
                    
                    <div class="p-5 bg-gray-50/50 border-t border-gray-100 flex justify-end">
                        <button type="submit" class="btn-primary py-2.5 px-6 flex items-center">
                            <i data-lucide="save" class="h-4 w-4 mr-2"></i>
                            Simpan Pengaturan
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- Modal: Update Odometer -->
    <div id="odometer-modal" class="modal-overlay hidden fixed inset-0 bg-gray-900/50 z-50 flex justify-center items-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform modal-content animate-fade-in-up">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900">Update Odometer</h3>
                <button onclick="closeModal('odometer-modal')" class="text-gray-400 hover:text-gray-600 transition-smooth">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
            <form id="odometer-form" class="p-6">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Odometer Saat Ini (KM)</label>
                    <div class="relative rounded-xl shadow-sm">
                        <input type="number" id="current-odometer-input" class="form-input w-full pl-4 pr-12 text-lg font-semibold text-center h-12" required min="0" step="1">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-medium">KM</span>
                        </div>
                    </div>
                    <p class="mt-3 text-xs text-gray-500">Odometer terakhir: <span id="last-odometer-text" class="font-medium text-gray-700">0</span> KM</p>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal('odometer-modal')" class="btn-secondary py-2.5 px-4 flex-1">Batal</button>
                    <button type="submit" class="btn-primary py-2.5 px-4 flex-1">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add/Edit Log -->
    <div id="log-modal" class="modal-overlay hidden fixed inset-0 bg-gray-900/50 z-50 flex justify-center items-center p-4 backdrop-blur-sm transition-opacity opacity-0 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform modal-content my-auto animate-fade-in-up">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 class="text-lg font-semibold text-gray-900" id="log-modal-title">Catat Perawatan</h3>
                <button onclick="closeModal('log-modal')" class="text-gray-400 hover:text-gray-600 transition-smooth">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
            <form id="log-form" class="p-6 max-h-[70vh] overflow-y-auto">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Perawatan <span class="text-red-500">*</span></label>
                        <select id="log-type-id" class="form-input w-full" required>
                            <option value="">Pilih Jenis Perawatan</option>
                            <!-- Injected via JS -->
                        </select>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal <span class="text-red-500">*</span></label>
                            <input type="date" id="log-date" class="form-input w-full" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Odometer (KM) <span class="text-red-500">*</span></label>
                            <input type="number" id="log-odometer" class="form-input w-full" required min="0">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Biaya (Rp)</label>
                        <div class="relative rounded-xl shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="text-gray-500 sm:text-sm">Rp</span>
                            </div>
                            <input type="number" id="log-cost" class="form-input w-full pl-10" placeholder="0" min="0">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bengkel</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-lucide="map-pin" class="h-4 w-4 text-gray-400"></i>
                            </div>
                            <input type="text" id="log-workshop" class="form-input w-full pl-10" placeholder="Nama Bengkel">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sparepart diganti</label>
                        <input type="text" id="log-parts" class="form-input w-full" placeholder="Misal: Oli Shell Advance, Filter udara">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Catatan</label>
                        <textarea id="log-notes" rows="3" class="form-input w-full resize-none" placeholder="Catatan tambahan..."></textarea>
                    </div>
                </div>
                
                <div class="flex justify-end gap-3 mt-6 pt-5 border-t border-gray-50">
                    <button type="button" onclick="closeModal('log-modal')" class="btn-secondary py-2.5 px-4">Batal</button>
                    <button type="submit" class="btn-primary py-2.5 px-6 flex items-center">
                        <i data-lucide="save" class="h-4 w-4 mr-2"></i>
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay hidden fixed inset-0 bg-gray-900/50 z-50 flex justify-center items-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform modal-content text-center p-6 animate-fade-in-up">
            <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-red-50 mb-5">
                <i data-lucide="alert-triangle" class="h-7 w-7 text-red-500"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mb-2" id="confirm-title">Konfirmasi</h3>
            <p class="text-sm text-gray-500 mb-6" id="confirm-message">Apakah Anda yakin?</p>
            <div class="flex justify-center gap-3">
                <button type="button" onclick="closeModal('confirm-modal')" class="btn-secondary py-2.5 px-4 flex-1">Batal</button>
                <button type="button" id="confirm-btn" class="bg-red-500 hover:bg-red-600 text-white py-2.5 px-4 rounded-xl font-medium shadow-md transition-smooth flex-1">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-full px-4 sm:bottom-6"></div>

    <script src="js/app.js"></script>
    <script src="js/vehicle-detail.js"></script>
</body>
</html>
